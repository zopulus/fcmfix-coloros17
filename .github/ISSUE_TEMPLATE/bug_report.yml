name: 推送或界面问题
description: 报告 ColorOS17 定制版的问题
title: "[问题] "
body:
  - type: input
    id: versions
    attributes:
      label: 系统、模块和 LSPosed 版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与发生时间
      description: 请注明目标应用、是否重启、息屏及后台状态
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请检查并去除隐私信息，不要上传签名密钥

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "io.github.zopulus.ffc"
    compileSdk 37

    defaultConfig {
        applicationId "io.github.zopulus.ffc"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 92
        versionName "2026100801"

        ndk {
            abiFilters "arm64-v8a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        checkReleaseBuilds = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android-compatible org.json implementation for JVM tests; the SDK jar contains stubs.
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.core:core-ktx:1.17.0'
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace = "io.github.zopulus.ffc"
    compileSdk 37

    defaultConfig {
        applicationId "io.github.zopulus.ffc"
        // ClassValue requires API 34; this fork supports ColorOS17 only.
        minSdkVersion 34
        targetSdkVersion 34
        versionCode 95
        versionName "2026111901"

        ndk {
            abiFilters "arm64-v8a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // COUI navigation exposes inline APIs compiled for Java 21.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation 'io.github.suqi8.coui.kmp:coui-ui-android:2.0.0'
    implementation 'io.github.suqi8.coui.kmp:coui-preference-android:2.0.0'
    implementation 'io.github.suqi8.coui.kmp:coui-blur-android:2.0.0'
    implementation 'io.github.suqi8.coui.kmp:coui-icons-android:2.0.0'
    implementation 'io.github.suqi8.coui.kmp:coui-squircle-android:2.0.0'
    implementation 'io.github.suqi8.coui.kmp:coui-nav-android:2.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    // Android-compatible org.json implementation for JVM tests; the SDK jar contains stubs.
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.core:core-ktx:1.17.0'
}
